[package]
name = "rs-bhakti-digital-desktop"
version = "1.0.0"
description = "RS Bhakti Digital Enterprise SIMRS Desktop Application"
authors = ["Tim SIMRS RS Bhakti Digital <dev@rsbhaktidigital.id>"]
license = "Proprietary"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
